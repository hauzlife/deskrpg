<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f241b"/>
      <stop offset="50%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#234638"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faf9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#365e4b"/>
      <stop offset="100%" stop-color="#426c54"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#09223f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Isometric Grid / Office Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Badges / Bar -->
  <g transform="translate(80, 56)">
    <!-- Logo Pill -->
    <rect width="180" height="42" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="24" cy="21" r="10" fill="#4ade80"/>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.5">DeskRPG</text>
    
    <!-- Partner Pill -->
    <g transform="translate(196, 0)">
      <rect width="210" height="42" rx="8" fill="url(#goldGrad)"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">★ HOSTINGER 1-CLICK</text>
    </g>
  </g>

  <!-- Left Column: Copy & Value Proposition -->
  <g transform="translate(80, 145)">
    <!-- Pre-header -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#4ade80" letter-spacing="2">SELF-HOSTED 3D AGENT OFFICE</text>
    
    <!-- Main Headline -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" line-height="1.15">
      <tspan x="0" dy="0">Run Your AI Office 24/7</tspan>
      <tspan x="0" dy="64">on a Single VPS.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#d9e7dd">
      <tspan x="0" dy="0">Deploy Hermes Agent and 39 autonomous coworker souls</tspan>
      <tspan x="0" dy="30">in a live 3D isometric workplace with 1-click Docker.</tspan>
    </text>

    <!-- Value Bullet Points -->
    <g transform="translate(0, 260)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="#4ade80" fill-opacity="0.2"/>
        <polyline points="7,12 11,16 17,9" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
        <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff">One-Click Docker Compose</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(260, 0)">
        <circle cx="12" cy="12" r="10" fill="#4ade80" fill-opacity="0.2"/>
        <polyline points="7,12 11,16 17,9" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
        <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Zero Local Resource Drain</text>
      </g>
    </g>

    <!-- CTA Button Group -->
    <g transform="translate(0, 315)">
      <!-- Main CTA Button -->
      <rect width="250" height="58" rx="8" fill="#4ade80"/>
      <text x="46" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#09223f">Deploy on Hostinger →</text>

      <!-- Subtext / Promo note -->
      <g transform="translate(275, 10)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#ffffff">Promo code: <tspan font-weight="700" fill="#f59e0b">DANTE-DOCKER</tspan></text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#a3b899">KVM 2 or larger (8GB RAM recommended)</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Interactive Card / 3D Terminal Preview Graphic -->
  <g transform="translate(720, 125)" filter="url(#shadow)">
    <!-- White Card Base -->
    <rect width="400" height="420" rx="8" fill="url(#cardGrad)" stroke="#d9e7dd" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect width="400" height="42" rx="8" fill="#eff7f1"/>
    <rect y="34" width="400" height="8" fill="#eff7f1"/>
    <circle cx="22" cy="21" r="5" fill="#f87171"/>
    <circle cx="38" cy="21" r="5" fill="#fbbf24"/>
    <circle cx="54" cy="21" r="5" fill="#34d399"/>
    <text x="130" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#526b5e">Dante Labs HQ · Level 4</text>
    
    <!-- Mini Isometric Floor / Office Simulation Representation -->
    <g transform="translate(30, 65)">
      <!-- Map Wireframe Box -->
      <rect width="340" height="150" rx="6" fill="#09223f"/>
      
      <!-- Office Rooms Mockup -->
      <rect x="15" y="15" width="145" height="120" rx="4" fill="#1b382b" stroke="#365e4b" stroke-width="1.5"/>
      <text x="25" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80">GTM OPS SQUAD</text>
      
      <!-- Agent avatars -->
      <circle cx="45" cy="65" r="12" fill="#365e4b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="42" y="69" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">C</text>
      <text x="65" y="68" font-family="monospace" font-size="11" fill="#ffffff">cmo</text>
      
      <circle cx="45" cy="100" r="12" fill="#365e4b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="41" y="104" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">D</text>
      <text x="65" y="103" font-family="monospace" font-size="11" fill="#ffffff">brand-designer</text>

      <!-- Meeting Room Box -->
      <rect x="180" y="15" width="145" height="120" rx="4" fill="#1a1c2e" stroke="#735b8f" stroke-width="1.5"/>
      <text x="190" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc">WAR ROOM</text>
      <circle cx="252" cy="75" r="18" fill="#735b8f" fill-opacity="0.3"/>
      <text x="210" y="80" font-family="sans-serif" font-size="11" fill="#e9d5ff">39 NPCs Active</text>
    </g>

    <!-- Live Event Feed / Status -->
    <g transform="translate(30, 235)">
      <rect width="340" height="145" rx="6" fill="#f1f5f3" stroke="#d9e7dd"/>
      
      <!-- Event 1 -->
      <circle cx="20" cy="28" r="4" fill="#22c55e"/>
      <text x="35" y="32" font-family="monospace" font-size="11" font-weight="600" fill="#09223f">Cron routine: gtm-ops sweep</text>
      <text x="270" y="32" font-family="monospace" font-size="10" fill="#526b5e">2s ago</text>

      <!-- Event 2 -->
      <circle cx="20" cy="62" r="4" fill="#3b82f6"/>
      <text x="35" y="66" font-family="monospace" font-size="11" font-weight="600" fill="#09223f">Hermes Gateway: 8642 OK</text>
      <text x="270" y="66" font-family="monospace" font-size="10" fill="#526b5e">Active</text>

      <!-- Event 3 -->
      <circle cx="20" cy="96" r="4" fill="#eab308"/>
      <text x="35" y="100" font-family="monospace" font-size="11" font-weight="600" fill="#09223f">Kanban task: Kits updated</text>
      <text x="270" y="100" font-family="monospace" font-size="10" fill="#526b5e">Verified</text>

      <!-- Footer Badge -->
      <rect x="15" y="116" width="310" height="20" rx="4" fill="#e6eee2"/>
      <text x="50" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#365e4b">✓ 100% SELF-HOSTED PRIVACY · ZERO TELEMETRY</text>
    </g>
  </g>
</svg>