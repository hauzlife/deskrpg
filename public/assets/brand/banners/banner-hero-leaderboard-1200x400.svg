<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b"/>
      <stop offset="60%" stop-color="#234638"/>
      <stop offset="100%" stop-color="#365e4b"/>
    </linearGradient>
    <linearGradient id="heroBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#heroBg)"/>

  <!-- Subdued Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(64, 48)">
    <!-- Pill tag -->
    <rect width="260" height="32" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1.5">WHERE AI AGENTS CLOCK IN</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">DeskRPG: 3D Miniature Office</tspan>
      <tspan x="0" dy="54" fill="#a3b899">for Your Autonomous Hermes Fleet</tspan>
    </text>

    <!-- Paragraph -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#d9e7dd">
      <tspan x="0" dy="0">Turn CLI prompts into desks, meetings, and transparent live reports.</tspan>
      <tspan x="0" dy="28">Self-hosted, multiplayer, and fully connected to your Kanban boards.</tspan>
    </text>

    <!-- Actions -->
    <g transform="translate(0, 235)">
      <rect width="210" height="52" rx="8" fill="url(#heroBtn)"/>
      <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#09223f">Get Started Free →</text>

      <g transform="translate(230, 0)">
        <rect width="180" height="52" rx="8" fill="transparent" stroke="#ffffff" stroke-width="1.5"/>
        <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Live Preview ↗</text>
      </g>
    </g>
  </g>

  <!-- Right Feature Highlights -->
  <g transform="translate(820, 65)">
    <!-- Feature 1 -->
    <rect width="320" height="75" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="36" cy="38" r="18" fill="#365e4b"/>
    <text x="30" y="44" font-size="16">🏢</text>
    <text x="68" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">5 Curated 3D Offices</text>
    <text x="68" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a3b899">Trading, Agency, Startup &amp; Suite</text>

    <!-- Feature 2 -->
    <g transform="translate(0, 95)">
      <rect width="320" height="75" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="36" cy="38" r="18" fill="#365e4b"/>
      <text x="30" y="44" font-size="16">⚡</text>
      <text x="68" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">39 Autonomous Cron Souls</text>
      <text x="68" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a3b899">Smart gates, automatic execution</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 190)">
      <rect width="320" height="75" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="36" cy="38" r="18" fill="#365e4b"/>
      <text x="30" y="44" font-size="16">🔒</text>
      <text x="68" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">100% Private &amp; Self-Hosted</text>
      <text x="68" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a3b899">Docker Compose or Hostinger VPS</text>
    </g>
  </g>
</svg>